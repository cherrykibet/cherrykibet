<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ring-outer { animation: spinForward 18s linear infinite; transform-origin: 100px 100px; }
      .ck-center  { animation: spinBack 18s linear infinite; transform-origin: 100px 100px; }
      .glow-ring  { animation: glowPulse 3s ease-in-out infinite; }

      @keyframes spinForward {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes spinBack {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0,210,255,0.5)); }
        50%      { filter: drop-shadow(0 0 20px rgba(0,210,255,0.9)) drop-shadow(0 0 40px rgba(0,210,255,0.3)); }
      }
    </style>

    <path id="topArc" d="M 18,100 A 82,82 0 0,1 182,100"/>
    <path id="botArc" d="M 26,116 A 76,76 0 0,0 174,116"/>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f1a20"/>
      <stop offset="100%" stop-color="#050d10"/>
    </linearGradient>
  </defs>

  <!-- Static glowing background circle -->
  <g class="glow-ring">
    <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#00d2ff" stroke-width="2"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#00d2ff" stroke-width="0.6" opacity="0.3"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Spinning outer ring with text -->
  <g class="ring-outer">
    <circle cx="100" cy="100" r="92" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>

    <text font-family="'Arial', sans-serif" font-size="11.5"
          fill="#00d2ff" letter-spacing="5.2" text-anchor="middle">
      <textPath href="#topArc" startOffset="50%">PERSONAL BRAND</textPath>
    </text>
    <text font-family="'Arial', sans-serif" font-size="10.5"
          fill="#00d2ff" letter-spacing="4.5" opacity="0.75" text-anchor="middle">
      <textPath href="#botArc" startOffset="50%">NAIROBI · KENYA</textPath>
    </text>
  </g>

  <!-- Counter-rotating CK center -->
  <g class="ck-center">
    <text x="100" y="116"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="72"
          fill="#00d2ff"
          text-anchor="middle"
          dominant-baseline="middle"
          letter-spacing="6">CK</text>
  </g>

</svg>
